syntax = "proto3";

package parse.v1;

service ServiceCentersService {
    rpc GetRegions(GetRegionsRequest) returns (GetRegionsResponse);
    rpc GetCities(GetCitiesRequest) returns (GetCitiesResponse);
    rpc GetServiceCenters(GetServiceCentersRequest) returns (GetServiceCentersResponse);
}

message GetRegionsRequest {
    string option_id = 1;
}

message GetRegionsResponse {
    repeated Region regions = 1;
}

message GetCitiesRequest {
    string option_id = 1;
    string region_id = 2;
}

message GetCitiesResponse {
    repeated City cities = 1;
}

message GetServiceCentersRequest {
    string option_id = 1;
    string city_id = 2;
}

message GetServiceCentersResponse {
    repeated ServiceCenter service_centers = 1;
}

message Region {
    string id = 1;
    string name = 2;
}

message City {
    string id = 1;
    string name = 2;
}

message ServiceCenter {
    string id = 1;
    string name = 2;
    string street = 3;
    string building = 4;
}
