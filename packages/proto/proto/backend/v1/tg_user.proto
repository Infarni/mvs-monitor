syntax = "proto3";

package backend.v1;

service TgUserService {
    rpc CreateTgUser(CreateTgUserRequest) returns (CreateTgUserResponse);
    rpc GetTgUser(GetTgUserRequest) returns (GetTgUserResponse);
}

message CreateTgUserRequest {
    int64 telegram_id = 1;
    string phone_number = 2;
}

message CreateTgUserResponse {}

message GetTgUserRequest {
    int64 telegram_id = 1;
}

message GetTgUserResponse {
    string id = 1;
    int64 telegram_id = 2;
    string phone_number = 3;
}
